# Staged quality-gate CI — lint → typecheck → test → build
# Runs on every PR and push to main; no deploy/publish steps.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.28.0"

jobs:
  # ──────────────────────────────────────────────
  # 1. Install dependencies and cache pnpm store
  # ──────────────────────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client is gitignored — generate it so downstream jobs can
      # typecheck and build packages that depend on @mmpi2/db.
      - name: Generate Prisma client
        run: pnpm --filter @mmpi2/db db:generate

  # ──────────────────────────────────────────────
  # 2. Lint (Biome via Turbo)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ──────────────────────────────────────────────
  # 3. Type-check (tsc via Turbo)
  # ──────────────────────────────────────────────
  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @mmpi2/db db:generate
      - run: pnpm typecheck

  # ──────────────────────────────────────────────
  # 4. Test (Vitest/Jest via Turbo)
  # ──────────────────────────────────────────────
  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @mmpi2/db db:generate
      - run: pnpm test

  # ──────────────────────────────────────────────
  # 5. Build (tsc / Next.js / NestJS via Turbo)
  # ──────────────────────────────────────────────
  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @mmpi2/db db:generate
      - run: pnpm build
